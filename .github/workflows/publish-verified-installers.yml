name: Publish verified v0.2.1 installers

on:
  push:
    branches: [fix/reuse-retained-local-models]
    paths: [.github/workflows/publish-verified-installers.yml]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the successful build and its source commit
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/"$GH_REPO"/actions/runs/43504557466 > run.json
          jq -e '.conclusion == "success" and .head_sha == "4ba25f74fef61f85f6d07224aa5eb5132e396331"' run.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43504557466
          pattern: installer-*
          path: release-files
          merge-multiple: true
      - name: Publish the verified Windows and Mac installers
        shell: bash
        run: |
          set -euo pipefail
          find release-files -type f
          mapfile -t windows_files < <(find release-files -type f -name '*.exe')
          mapfile -t mac_files < <(find release-files -type f -name '*.dmg')
          test "${#windows_files[@]}" -eq 1
          test "${#mac_files[@]}" -eq 1
          mkdir release-assets
          windows=release-assets/Philosophy.Local.AI_0.2.1_x64-setup.exe
          mac=release-assets/Philosophy.Local.AI_0.2.1_universal.dmg
          cp "${windows_files[0]}" "$windows"
          cp "${mac_files[0]}" "$mac"
          test -s "$windows"
          test -s "$mac"
          sha256sum "$windows" "$mac"
          gh release create v0.2.1 "$windows" "$mac" \
            --target 4ba25f74fef61f85f6d07224aa5eb5132e396331 \
            --draft --prerelease --title '필로소피 로컬 AI v0.2.1 (시험판)' \
            --notes-file docs/RELEASE_NOTES_v0.2.1.md
          gh release edit v0.2.1 --draft=false --prerelease

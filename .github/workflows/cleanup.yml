# 저장 공간 정리: Actions 아티팩트와 캐시를 모두 지운다 (GitHub Releases의 배포 파일은 지우지 않음).
# GitHub 무료 요금제 저장 공간(0.5GB)을 넘었다는 안내가 오면 Actions 화면에서 직접 실행한다.
name: cleanup

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: 아티팩트 삭제
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/artifacts" --paginate -q '.artifacts[].id')
          n=0
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && n=$((n+1)); done
          echo "아티팩트 ${n}개 삭제"
      - name: 캐시 삭제
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches" --paginate -q '.actions_caches[].id')
          n=0
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/caches/$id" && n=$((n+1)); done
          echo "캐시 ${n}개 삭제"
          gh api "repos/$REPO/actions/cache/usage" -q '"남은 캐시: \(.active_caches_size_in_bytes) bytes"' || true

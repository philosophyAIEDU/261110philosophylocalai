name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "사전 출시로 게시할 버전 태그 (예: v0.1.0-beta.1). 비워 두면 빌드만 합니다."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev strace iproute2
      - run: npm ci
      - run: npm run build
      - name: 핵심 로직 + 통합 + 정적 보안 테스트
        run: cargo test -p pla-core --features fake-engine
      - name: 오프라인·연결 감사 보안 테스트
        run: sudo -E env "PATH=$PATH" bash scripts/security-tests.sh

  bundle:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - name: 엔진 무결성값이 등록되어 있는지 확인
        shell: bash
        run: |
          node -e 'const m=require("./crates/core/src/runtime/engine-manifest.json");const miss=Object.entries(m.assets).filter(([,a])=>!a.sha256);if(miss.length){console.error("sha256 미등록:",miss.map(x=>x[0]).join(", "));process.exit(1)}'
      - name: 핵심 로직 단위 테스트 (이 운영체제에서)
        run: cargo test -p pla-core --lib
      - name: 설치 파일 빌드 (서명 없음)
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    # 태그·수동 요청·엔진 복구 브랜치: 검증과 두 운영체제 빌드 성공 후 시험판 게시
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' || github.ref == 'refs/heads/fix/engine-download-416'
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: 사전 출시(Pre-release) 게시
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release-files -type f \( -name '*.exe' -o -name '*.dmg' \))
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -ge 2 ] || { echo "설치 파일이 부족합니다"; exit 1; }
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "$GITHUB_REF_NAME" = "fix/engine-download-416" ]; then TAG="v0.2.3"; fi
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "태그 형식 오류: $TAG"; exit 1; }
          notes="docs/RELEASE_NOTES_${TAG}.md"
          [ -f "$notes" ] || { echo "릴리스 노트가 없습니다: $notes"; exit 1; }
          VERSION=$(jq -r .version package.json)
          mkdir release-assets
          windows=$(find release-files -type f -name '*.exe')
          mac=$(find release-files -type f -name '*.dmg')
          test -s "$windows"
          test -s "$mac"
          cp "$windows" "release-assets/Philosophy.Local.AI_${VERSION}_x64-setup.exe"
          cp "$mac" "release-assets/Philosophy.Local.AI_${VERSION}_universal.dmg"
          files=(release-assets/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --prerelease --notes-file "$notes"
          else
            gh release create "$TAG" "${files[@]}" --target "$GITHUB_SHA" \
              --draft --prerelease --title "필로소피 로컬 AI ${TAG} (시험판)" --notes-file "$notes"
            gh release edit "$TAG" --draft=false --prerelease
          fi

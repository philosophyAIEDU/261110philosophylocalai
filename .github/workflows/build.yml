name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev strace iproute2
      - run: npm ci
      - run: npm run build
      - name: 핵심 로직 + 통합 + 정적 보안 테스트
        run: cargo test -p pla-core --features fake-engine
      - name: 오프라인·연결 감사 보안 테스트
        run: sudo -E env "PATH=$PATH" bash scripts/security-tests.sh

  bundle:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
          - os: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - name: 엔진 무결성값이 등록되어 있는지 확인
        shell: bash
        run: |
          node -e 'const m=require("./crates/core/src/runtime/engine-manifest.json");const miss=Object.entries(m.assets).filter(([,a])=>!a.sha256);if(miss.length){console.error("sha256 미등록:",miss.map(x=>x[0]).join(", "));process.exit(1)}'
      - name: 핵심 로직 단위 테스트 (이 운영체제에서)
        run: cargo test -p pla-core --lib
      - name: 설치 파일 빌드 (서명 없음)
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
